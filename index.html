<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Lankan Bus Mods | ETS2 & ATS Bus Mods</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            color: #ffffff;
            font-family: 'Lato', sans-serif;
            font-weight: 400;
            line-height: 1.5;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
            border-bottom: 1px solid #2a2a2a;
            display: inline-block;
            padding-bottom: 0.5rem;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .search-group {
            flex: 1;
            min-width: 200px;
            max-width: 350px;
        }

        .filter-group {
            display: flex;
            gap: 0.8rem;
        }

        .filter-input, .filter-select {
            width: 100%;
            padding: 12px 18px;
            background: #0a0a0a;
            border: 1px solid #2c2c2c;
            border-radius: 40px;
            color: #ffffff;
            font-family: 'Lato', sans-serif;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .filter-input:focus, .filter-select:focus {
            outline: none;
            border-color: #ffffff;
            background: #000000;
        }

        .filter-select {
            cursor: pointer;
            min-width: 120px;
        }

        .add-mod-section {
            max-width: 600px;
            margin: 0 auto 2rem auto;
            background: #0a0a0a;
            border-radius: 24px;
            padding: 1.5rem;
            border: 1px solid #2a2a2a;
        }

        .add-mod-section h3 {
            margin-bottom: 1rem;
            text-align: center;
        }

        .add-form input, .add-form textarea {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 12px;
            background: #111;
            border: 1px solid #2c2c2c;
            border-radius: 12px;
            color: white;
            font-family: 'Lato', sans-serif;
        }

        .add-form textarea {
            resize: vertical;
            min-height: 80px;
        }

        .add-form button {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Lato', sans-serif;
        }

        .add-form button:hover {
            background: #333;
            color: #fff;
        }

        .mod-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.8rem;
            margin-bottom: 2rem;
        }

        .mod-card {
            background: #050505;
            border-radius: 24px;
            padding: 1.2rem;
            border: 1px solid #222;
            transition: transform 0.2s, border-color 0.2s;
        }

        .mod-card:hover {
            transform: translateY(-3px);
            border-color: #ffffff;
        }

        .mod-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 16px;
            background: #121212;
            margin-bottom: 1rem;
        }

        .mod-card h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #ffffff;
            line-height: 1.3;
        }

        .mod-badges {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.6rem;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            background: #1a1a1a;
            color: #ccc;
        }

        .game-badge {
            background: #1f1f1f;
            color: #ffffff;
            border: 1px solid #3a3a3a;
        }

        .mod-meta {
            font-size: 0.75rem;
            color: #9a9a9a;
            border-left: 2px solid #333;
            padding-left: 8px;
            margin-bottom: 0.8rem;
        }

        .mod-desc {
            font-size: 0.8rem;
            color: #bbbbbb;
            margin: 0.8rem 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .delete-btn {
            background: #2a1a1a;
            color: #ff6666;
            border: 1px solid #ff6666;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            cursor: pointer;
            margin-left: 8px;
        }

        .delete-btn:hover {
            background: #ff6666;
            color: #000;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 30px 0 10px;
        }

        .pagination button {
            padding: 8px 20px;
            background: #0a0a0a;
            color: #ffffff;
            border: 1px solid #2c2c2c;
            border-radius: 40px;
            cursor: pointer;
            font-family: 'Lato', sans-serif;
            font-weight: 500;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .pagination button:hover:not(:disabled) {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .no-mods {
            text-align: center;
            padding: 3rem;
            color: #aaa;
        }

        @media (max-width: 640px) {
            body { padding: 1rem; }
            h1 { font-size: 1.6rem; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .search-group, .filter-group { max-width: 100%; }
            .filter-group { justify-content: space-between; }
            .filter-select { flex: 1; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>🚌 Sri Lankan Bus Mods</h1>
        <p style="margin-top: 0.5rem; color: #888;">ETS2 & ATS Bus Mods Collection</p>
    </header>

    <div class="filter-bar">
        <div class="search-group">
            <input type="text" id="searchInput" class="filter-input" placeholder="Search bus mods...">
        </div>
        <div class="filter-group">
            <select id="gameTypeFilter" class="filter-select">
                <option value="all">All Games</option>
                <option value="ETS2">ETS2</option>
                <option value="ATS">ATS</option>
            </select>
        </div>
    </div>

    <!-- Add Mod Section (Manual) -->
    <div class="add-mod-section">
        <h3>➕ Add New Bus Mod</h3>
        <form id="addModForm" class="add-form">
            <input type="text" id="modName" placeholder="Mod Name" required>
            <input type="text" id="modGame" placeholder="Game (ETS2 / ATS)" required>
            <input type="text" id="modVersion" placeholder="Game Version (e.g., 1.59)">
            <input type="text" id="modAuthor" placeholder="Author Name">
            <input type="url" id="modImage" placeholder="Image URL (optional)">
            <input type="url" id="modDownload" placeholder="Download URL" required>
            <textarea id="modDescription" placeholder="Description..."></textarea>
            <button type="submit">Add Mod</button>
        </form>
    </div>

    <div id="modsContainer" class="mod-grid"></div>

    <div class="pagination">
        <button id="prevPageBtn">Previous</button>
        <span id="pageInfo">Page 1 of 1</span>
        <button id="nextPageBtn">Next</button>
    </div>
</div>

<script>
    let allMods = [];
    let currentPage = 1;
    const modsPerPage = 24;
    let filteredMods = [];

    const modsContainer = document.getElementById('modsContainer');
    const searchInput = document.getElementById('searchInput');
    const gameTypeFilter = document.getElementById('gameTypeFilter');
    const prevBtn = document.getElementById('prevPageBtn');
    const nextBtn = document.getElementById('nextPageBtn');
    const pageInfoSpan = document.getElementById('pageInfo');

    // Load mods from localStorage
    function loadModsFromStorage() {
        const stored = localStorage.getItem('sri_lankan_bus_mods');
        if (stored) {
            allMods = JSON.parse(stored);
        } else {
            // Default sample mods
            allMods = [
                {
                    id: "1",
                    name: "Sample Lanka Ashok Leyland Bus",
                    game: "ETS2",
                    gameVersion: "1.59",
                    author: "LK Modder",
                    imageUrl: "",
                    downloadUrl: "https://example.com/download",
                    description: "Sri Lankan style Ashok Leyland bus mod for ETS2",
                    timestamp: new Date().toISOString()
                }
            ];
            saveModsToStorage();
        }
        applyFilters();
    }

    function saveModsToStorage() {
        localStorage.setItem('sri_lankan_bus_mods', JSON.stringify(allMods));
    }

    function addMod(mod) {
        mod.id = Date.now().toString();
        mod.timestamp = new Date().toISOString();
        allMods.unshift(mod);
        saveModsToStorage();
        applyFilters();
    }

    function deleteMod(modId) {
        allMods = allMods.filter(mod => mod.id !== modId);
        saveModsToStorage();
        applyFilters();
    }

    function getGameType(mod) {
        const game = (mod.game || '').toUpperCase();
        if (game.includes('ATS')) return 'ATS';
        return 'ETS2';
    }

    function applyFilters() {
        const searchTerm = searchInput.value.toLowerCase().trim();
        const gameType = gameTypeFilter.value;

        filteredMods = allMods.filter(mod => {
            const matchesSearch = searchTerm === '' ||
                (mod.name && mod.name.toLowerCase().includes(searchTerm)) ||
                (mod.author && mod.author.toLowerCase().includes(searchTerm));

            const matchesGameType = gameType === 'all' || getGameType(mod) === gameType;

            return matchesSearch && matchesGameType;
        });

        currentPage = 1;
        renderCurrentPage();
    }

    function renderCurrentPage() {
        if (!filteredMods.length) {
            modsContainer.innerHTML = '<div class="no-mods">No bus mods found. Add your first mod!</div>';
            updatePaginationInfo();
            return;
        }

        const start = (currentPage - 1) * modsPerPage;
        const end = start + modsPerPage;
        const pageMods = filteredMods.slice(start, end);

        modsContainer.innerHTML = '';
        pageMods.forEach(mod => {
            const card = document.createElement('div');
            card.className = 'mod-card';

            const imgUrl = mod.imageUrl && mod.imageUrl.trim() ? mod.imageUrl : 'https://via.placeholder.com/300x150?text=Bus+Mod';
            const versionLabel = mod.gameVersion || 'N/A';
            const authorLabel = mod.author || 'Unknown';
            const desc = mod.description ? (mod.description.length > 100 ? mod.description.substring(0, 100) + '…' : mod.description) : 'No description';

            card.innerHTML = `
                <img src="${imgUrl}" alt="${escapeHtml(mod.name)}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x150?text=Image+Error'">
                <h3>${escapeHtml(mod.name)}</h3>
                <div class="mod-badges">
                    <span class="badge game-badge">${escapeHtml(getGameType(mod))}</span>
                    <span class="badge version-badge">v${escapeHtml(versionLabel)}</span>
                </div>
                <div class="mod-meta">${escapeHtml(authorLabel)}</div>
                <div class="mod-desc">${escapeHtml(desc)}</div>
                <div style="display: flex; gap: 8px;">
                    <a href="${escapeHtml(mod.downloadUrl)}" target="_blank" class="download-btn" style="flex:1; background:#fff; color:#000; text-align:center; padding:8px; border-radius:40px; text-decoration:none; font-size:0.8rem;">Download</a>
                    <button class="delete-btn" data-id="${mod.id}">Delete</button>
                </div>
            `;
            modsContainer.appendChild(card);
        });

        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = btn.getAttribute('data-id');
                if (confirm('Delete this mod?')) {
                    deleteMod(id);
                }
            });
        });

        updatePaginationInfo();
    }

    function updatePaginationInfo() {
        const totalPages = Math.ceil(filteredMods.length / modsPerPage);
        pageInfoSpan.textContent = `Page ${currentPage} of ${totalPages || 1}`;
        prevBtn.disabled = currentPage <= 1;
        nextBtn.disabled = currentPage >= totalPages;
    }

    function prevPage() {
        if (currentPage > 1) {
            currentPage--;
            renderCurrentPage();
        }
    }

    function nextPage() {
        const totalPages = Math.ceil(filteredMods.length / modsPerPage);
        if (currentPage < totalPages) {
            currentPage++;
            renderCurrentPage();
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Form submit handler
    document.getElementById('addModForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const newMod = {
            name: document.getElementById('modName').value,
            game: document.getElementById('modGame').value,
            gameVersion: document.getElementById('modVersion').value || '1.59',
            author: document.getElementById('modAuthor').value || 'Community',
            imageUrl: document.getElementById('modImage').value,
            downloadUrl: document.getElementById('modDownload').value,
            description: document.getElementById('modDescription').value
        };
        addMod(newMod);
        document.getElementById('addModForm').reset();
        alert('Mod added successfully!');
    });

    searchInput.addEventListener('input', applyFilters);
    gameTypeFilter.addEventListener('change', applyFilters);
    prevBtn.addEventListener('click', prevPage);
    nextBtn.addEventListener('click', nextPage);

    loadModsFromStorage();
</script>
</body>
</html>
