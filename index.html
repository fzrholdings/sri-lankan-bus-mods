<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Lankan Bus Mods - GitHub Direct</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Lato', sans-serif !important; }
        body { background: #000000; color: #ffffff; line-height: 1.5; padding: 2rem 1rem; }
        .container { max-width: 1300px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2rem; }
        h1 { font-size: 2.2rem; font-weight: 700; border-bottom: 1px solid #2a2a2a; display: inline-block; padding-bottom: 0.5rem; }
        .status { text-align: center; margin-top: 0.5rem; font-size: 0.8rem; padding: 8px; border-radius: 8px; }
        .status.success { background: #1a3a1a; color: #2ecc71; }
        .status.error { background: #3a1a1a; color: #e74c3c; }
        .status.loading { background: #1a2a3a; color: #f39c12; }
        .search-wrapper { position: relative; max-width: 400px; margin: 0 auto 2rem auto; }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; color: #666; }
        .search-input { width: 100%; padding: 12px 20px 12px 48px; background: #0a0a0a; border: 1px solid #2c2c2c; border-radius: 40px; color: #ffffff; }
        .mod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.8rem; margin-bottom: 2rem; }
        .mod-card { background: #050505; border-radius: 24px; padding: 1.2rem; border: 1px solid #222; transition: transform 0.2s; cursor: pointer; }
        .mod-card:hover { transform: translateY(-3px); border-color: #ffffff; }
        .mod-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 16px; margin-bottom: 1rem; background: #1a1a1a; }
        .mod-card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; }
        .badge { font-size: 0.7rem; padding: 2px 10px; border-radius: 20px; background: #1a1a1a; color: #ccc; display: inline-block; }
        .mod-meta { font-size: 0.75rem; color: #9a9a9a; margin: 0.5rem 0; }
        .mod-desc { font-size: 0.8rem; color: #bbbbbb; margin: 0.5rem 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .download-btn { background: #ffffff; color: #000000; font-weight: 600; padding: 8px 18px; border-radius: 40px; font-size: 0.8rem; border: none; cursor: pointer; width: 100%; text-align: center; }
        .download-btn:hover { background: #333; color: #fff; }
        .pagination { display: flex; justify-content: center; gap: 20px; margin: 30px 0; }
        .pagination button { padding: 8px 20px; background: #0a0a0a; color: #ffffff; border: 1px solid #2c2c2c; border-radius: 40px; cursor: pointer; }
        .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
        .modal-content { background: #0a0a0a; border-radius: 24px; max-width: 600px; width: 90%; padding: 2rem; border: 1px solid #2a2a2a; max-height: 85vh; overflow-y: auto; }
        .close-btn { position: absolute; right: 20px; top: 15px; font-size: 28px; color: #aaa; cursor: pointer; }
        .no-mods { text-align: center; padding: 3rem; color: #aaa; }
        .loading-spinner { text-align: center; padding: 3rem; color: #f39c12; }
        @media (max-width: 640px) { body { padding: 1rem; } h1 { font-size: 1.6rem; } }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>🇱🇰 Sri Lankan Bus Mods</h1>
        <div id="status" class="status loading">🔄 Loading mods from GitHub...</div>
    </header>

    <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM9.5 14C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search bus mods...">
    </div>

    <div id="modsContainer" class="mod-grid">
        <div class="loading-spinner">🔄 Loading...</div>
    </div>

    <div class="pagination">
        <button id="prevPageBtn">◀ Previous</button>
        <span id="pageInfo">Page 1 of 1</span>
        <button id="nextPageBtn">Next ▶</button>
    </div>
</div>

<div id="detailsModal" class="modal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <div id="detailsContent"></div>
    </div>
</div>

<script>
    // ============================================
    // DIRECT GITHUB JSON READER - NO LOCAL STORAGE
    // ============================================
    
    // Your GitHub raw JSON URL
    const GITHUB_JSON_URL = "https://raw.githubusercontent.com/fzrholdings/sri-lankan-bus-mods/main/mods.json";
    
    let allMods = [];
    let filteredMods = [];
    let currentPage = 1;
    const modsPerPage = 24;
    
    // DOM elements
    const modsContainer = document.getElementById('modsContainer');
    const searchInput = document.getElementById('searchInput');
    const prevBtn = document.getElementById('prevPageBtn');
    const nextBtn = document.getElementById('nextPageBtn');
    const pageInfoSpan = document.getElementById('pageInfo');
    const statusDiv = document.getElementById('status');
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function setStatus(message, type = 'loading') {
        statusDiv.textContent = message;
        statusDiv.className = `status ${type}`;
    }
    
    // Load mods directly from GitHub
    async function loadModsFromGitHub() {
        setStatus("🔄 Fetching mods from GitHub...", "loading");
        modsContainer.innerHTML = '<div class="loading-spinner">🔄 Loading mods from GitHub...</div>';
        
        try {
            const response = await fetch(GITHUB_JSON_URL, {
                cache: 'no-store',  // Don't cache
                headers: {
                    'Cache-Control': 'no-cache'
                }
            });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            const data = await response.json();
            console.log("GitHub Response:", data);
            
            // Check if data has mods array
            if (data && data.mods && Array.isArray(data.mods)) {
                allMods = data.mods;
                const lastUpdated = data.lastUpdated ? new Date(data.lastUpdated).toLocaleString() : 'unknown';
                setStatus(`✅ Loaded ${allMods.length} mods from GitHub | Last updated: ${lastUpdated}`, "success");
                console.log(`✅ Successfully loaded ${allMods.length} mods`);
            } else if (Array.isArray(data)) {
                // If JSON is just an array
                allMods = data;
                setStatus(`✅ Loaded ${allMods.length} mods from GitHub`, "success");
            } else {
                throw new Error("Invalid JSON format - expected 'mods' array");
            }
            
            if (allMods.length === 0) {
                setStatus("⚠️ GitHub mods.json is empty. Add some mods!", "error");
                modsContainer.innerHTML = '<div class="no-mods">📦 No mods found in GitHub. Please add mods to mods.json file.</div>';
                return;
            }
            
            applyFilters();
            
        } catch (error) {
            console.error("GitHub fetch error:", error);
            setStatus(`❌ Failed to load from GitHub: ${error.message}`, "error");
            modsContainer.innerHTML = `
                <div class="no-mods">
                    ❌ Cannot load mods from GitHub<br><br>
                    <strong>Error:</strong> ${escapeHtml(error.message)}<br><br>
                    Check that your mods.json file exists at:<br>
                    <code style="background:#111; padding:4px; border-radius:4px;">${GITHUB_JSON_URL}</code>
                </div>
            `;
        }
    }
    
    function applyFilters() {
        const searchTerm = searchInput.value.toLowerCase().trim();
        
        if (searchTerm === '') {
            filteredMods = [...allMods];
        } else {
            filteredMods = allMods.filter(mod => {
                return (mod.name && mod.name.toLowerCase().includes(searchTerm)) ||
                       (mod.author && mod.author.toLowerCase().includes(searchTerm)) ||
                       (mod.description && mod.description.toLowerCase().includes(searchTerm));
            });
        }
        
        currentPage = 1;
        renderCurrentPage();
    }
    
    function renderCurrentPage() {
        if (!filteredMods.length) {
            modsContainer.innerHTML = '<div class="no-mods">🚌 No bus mods found. Try a different search term.</div>';
            updatePaginationInfo();
            return;
        }
        
        const start = (currentPage - 1) * modsPerPage;
        const end = start + modsPerPage;
        const pageMods = filteredMods.slice(start, end);
        
        modsContainer.innerHTML = '';
        
        pageMods.forEach(mod => {
            const card = document.createElement('div');
            card.className = 'mod-card';
            card.setAttribute('data-mod-id', mod.id);
            
            const imgUrl = mod.imageUrl && mod.imageUrl.trim() ? mod.imageUrl : 'https://via.placeholder.com/300x150?text=🚌+Bus+Mod';
            const versionLabel = mod.version || 'N/A';
            const authorLabel = mod.author || 'Unknown';
            const desc = mod.description ? (mod.description.length > 100 ? mod.description.substring(0, 100) + '…' : mod.description) : 'No description';
            
            card.innerHTML = `
                <img src="${imgUrl}" alt="${escapeHtml(mod.name)}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x150?text=🚌+Bus+Mod'">
                <h3>${escapeHtml(mod.name)}</h3>
                <div><span class="badge">📌 v${escapeHtml(versionLabel)}</span></div>
                <div class="mod-meta">👤 ${escapeHtml(authorLabel)}</div>
                <div class="mod-desc">📝 ${escapeHtml(desc)}</div>
                <button class="download-btn" data-url="${escapeHtml(mod.downloadUrl)}">⬇️ Download</button>
            `;
            modsContainer.appendChild(card);
        });
        
        // Attach download events
        document.querySelectorAll('.download-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const url = btn.getAttribute('data-url');
                if (url && url !== '#') {
                    window.open(url, '_blank', 'noopener,noreferrer');
                } else {
                    alert('Download link not available');
                }
            });
        });
        
        // Attach card click for details
        document.querySelectorAll('.mod-card').forEach(card => {
            card.addEventListener('click', (e) => {
                if (e.target.classList.contains('download-btn')) return;
                const modId = card.getAttribute('data-mod-id');
                const mod = allMods.find(m => m.id == modId);
                if (mod) openDetailsModal(mod);
            });
        });
        
        updatePaginationInfo();
    }
    
    function openDetailsModal(mod) {
        const modal = document.getElementById('detailsModal');
        const container = document.getElementById('detailsContent');
        const imgUrl = mod.imageUrl && mod.imageUrl.trim() ? mod.imageUrl : 'https://via.placeholder.com/400x200?text=No+Image';
        
        container.innerHTML = `
            <div style="text-align:center">
                <img src="${imgUrl}" style="max-width:100%; border-radius:16px;" onerror="this.src='https://via.placeholder.com/400x200'">
            </div>
            <h2 style="margin-top:1rem">${escapeHtml(mod.name)}</h2>
            <p><strong>📌 Version:</strong> ${escapeHtml(mod.version || 'N/A')}</p>
            <p><strong>👤 Author:</strong> ${escapeHtml(mod.author || 'Unknown')}</p>
            <div style="background:#111; padding:1rem; border-radius:12px; margin:1rem 0;">
                <strong>📝 Description:</strong>
                <p style="margin-top:0.5rem; color:#bbb;">${escapeHtml(mod.description || 'No description available.')}</p>
            </div>
            <button id="detailsDownloadBtn" style="background:#fff; color:#000; padding:12px; border-radius:40px; width:100%; border:none; font-weight:700; cursor:pointer;">⬇️ Download Mod</button>
        `;
        
        modal.style.display = 'flex';
        
        const downloadBtn = document.getElementById('detailsDownloadBtn');
        if (downloadBtn) {
            downloadBtn.addEventListener('click', () => {
                if (mod.downloadUrl && mod.downloadUrl !== '#') {
                    window.open(mod.downloadUrl, '_blank', 'noopener,noreferrer');
                } else {
                    alert('Download link not available');
                }
            });
        }
    }
    
    function updatePaginationInfo() {
        const totalPages = Math.ceil(filteredMods.length / modsPerPage);
        pageInfoSpan.textContent = `Page ${currentPage} of ${totalPages || 1}`;
        prevBtn.disabled = currentPage <= 1;
        nextBtn.disabled = currentPage >= totalPages;
    }
    
    function prevPage() {
        if (currentPage > 1) {
            currentPage--;
            renderCurrentPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }
    
    function nextPage() {
        const totalPages = Math.ceil(filteredMods.length / modsPerPage);
        if (currentPage < totalPages) {
            currentPage++;
            renderCurrentPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }
    
    function closeModals() {
        const modal = document.getElementById('detailsModal');
        if (modal) modal.style.display = 'none';
    }
    
    // Event Listeners
    searchInput.addEventListener('input', applyFilters);
    prevBtn.addEventListener('click', prevPage);
    nextBtn.addEventListener('click', nextPage);
    
    document.querySelectorAll('.close-btn').forEach(btn => {
        btn.addEventListener('click', closeModals);
    });
    window.addEventListener('click', (e) => {
        if (e.target.classList.contains('modal')) closeModals();
    });
    
    // Load mods when page loads
    loadModsFromGitHub();
    
    // Refresh every 5 minutes (optional)
    setInterval(() => {
        console.log("Auto-refreshing mods from GitHub...");
        loadModsFromGitHub();
    }, 5 * 60 * 1000);
</script>
</body>
</html>
