<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sri Lankan Bus Mods | ETS2 & ATS</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <h1 id="mainTitle">Sri Lankan Bus Mods</h1>
        <div id="adminPanelBtn" style="display:none;">
            <button id="addModBtn" class="admin-action-btn">+ Add New Mod</button>
        </div>
    </header>

    <!-- Only search bar -->
    <div class="filter-bar">
        <div class="search-group">
            <input type="text" id="searchInput" class="filter-input" placeholder="Search mods...">
        </div>
    </div>

    <!-- Mods grid -->
    <div id="modsContainer" class="mod-grid"></div>

    <!-- Pagination -->
    <div class="pagination" id="paginationControls">
        <button id="prevPageBtn">Previous</button>
        <span id="pageInfo">Page 1 of 1</span>
        <button id="nextPageBtn">Next</button>
    </div>
</div>

<!-- Details Modal (simple modern) -->
<div id="detailsModal" class="modal">
    <div class="modal-content details-modal">
        <span class="close-btn details-close">&times;</span>
        <div id="detailsContent" class="details-container"></div>
    </div>
</div>

<!-- Admin Add/Edit Modal -->
<div id="adminModal" class="modal">
    <div class="modal-content admin-modal">
        <span class="close-btn admin-close">&times;</span>
        <h2 id="adminModalTitle">Add New Mod</h2>
        <form id="adminModForm">
            <input type="hidden" id="editModId" value="">
            <input type="text" id="modName" placeholder="Mod Name" required>
            <input type="text" id="modVersion" placeholder="Game Version (e.g., 1.51)" required>
            <input type="text" id="modAuthor" placeholder="Author" required>
            <input type="url" id="modImageUrl" placeholder="Image URL">
            <input type="url" id="modDownloadUrl" placeholder="Download URL" required>
            <textarea id="modDescription" placeholder="Description" rows="3"></textarea>
            <select id="modCategory" required>
                <option value="ETS2">ETS2</option>
                <option value="ATS">ATS</option>
                <option value="Bus Mod">Bus Mod</option>
            </select>
            <button type="submit">Save Mod</button>
            <button type="button" id="cancelAdminBtn">Cancel</button>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
