<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sri Lankan Bus Mods | ETS2 Bus Mods Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Additional overrides to ensure everything is Lato */
        * {
            font-family: 'Lato', sans-serif !important;
        }
        
        /* Title double-click hint - subtle indicator that admin login is hidden */
        .admin-hidden-hint {
            position: relative;
            cursor: default;
        }
        
        .admin-hidden-hint:hover::after {
            content: "⏦";
            position: absolute;
            right: -20px;
            top: 0;
            font-size: 14px;
            opacity: 0.4;
            pointer-events: none;
        }
        
        input, textarea, button, .login-input, .login-submit, .download-btn, .logout-btn {
            font-family: 'Lato', sans-serif !important;
        }
        
        .admin-panel {
            transition: all 0.2s ease;
        }
        
        /* Edit button style */
        .edit-btn {
            background: #2a2a2a;
            color: #ffcc00;
            border: 1px solid #ffcc00;
            padding: 6px 12px;
            border-radius: 40px;
            cursor: pointer;
            font-family: 'Lato', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            transition: 0.2s;
        }
        
        .edit-btn:hover {
            background: #ffcc00;
            color: #000000;
        }
        
        .admin-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        
        .delete-btn {
            background: #2a2a2a;
            color: #ff6666;
            border: 1px solid #ff6666;
            padding: 6px 12px;
            border-radius: 40px;
            cursor: pointer;
            font-family: 'Lato', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .delete-btn:hover {
            background: #ff6666;
            color: #000;
        }
        
        /* Edit Modal specific styles */
        .edit-modal .modal-content {
            max-width: 600px;
        }
        
        .edit-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 1rem;
        }
        
        .edit-form input, .edit-form textarea {
            width: 100%;
            padding: 12px 14px;
            background: #111;
            border: 1px solid #2c2c2c;
            border-radius: 12px;
            color: white;
            font-family: 'Lato', sans-serif;
            font-size: 0.9rem;
        }
        
        .edit-form input:focus, .edit-form textarea:focus {
            outline: none;
            border-color: #ffffff;
        }
        
        .edit-form button {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Lato', sans-serif;
            transition: 0.2s;
        }
        
        .edit-form button:hover {
            background: #333;
            color: #fff;
        }
        
        .edit-modal h3 {
            margin-bottom: 1rem;
            color: #ffcc00;
        }
        
        /* Download button - ensure cursor pointer */
        .download-btn {
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <!-- Double-click on title to reveal admin login - no subtitle shown -->
        <h1 id="mainTitle" class="admin-hidden-hint">Sri Lankan Bus Mods</h1>
    </header>

    <!-- Admin Panel - Only visible when logged in (initially hidden) -->
    <div id="adminPanel" class="admin-panel" style="display: none;">
        <div class="admin-header">
            <h3>Admin Panel</h3>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
        
        <!-- Add Mod Form -->
        <div class="add-mod-section">
            <h4>Add New Bus Mod</h4>
            <form id="addModForm" class="add-form">
                <input type="text" id="modName" placeholder="Mod Name" required>
                <input type="text" id="modVersion" placeholder="Game Version (e.g., 1.59)" required>
                <input type="text" id="modAuthor" placeholder="Author Name" required>
                <input type="url" id="modImage" placeholder="Image URL (ImgBB link)">
                <input type="url" id="modDownload" placeholder="Download URL (modsfile.com / sharemods)" required>
                <textarea id="modDescription" placeholder="Description..." rows="3"></textarea>
                <button type="submit">Add Mod</button>
            </form>
        </div>
    </div>

    <!-- Login Section hidden - triggered by double-click title -->
    <div id="loginSection" class="login-section" style="display: none;"></div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content login-modal">
            <span class="close-btn">&times;</span>
            <h3>Admin Login</h3>
            <input type="password" id="adminPassword" placeholder="Enter Password" class="login-input">
            <button id="loginSubmitBtn" class="login-submit">Login</button>
        </div>
    </div>

    <!-- Edit Mod Modal -->
    <div id="editModal" class="modal edit-modal">
        <div class="modal-content">
            <span class="close-btn edit-close">&times;</span>
            <h3>Edit Bus Mod</h3>
            <form id="editModForm" class="edit-form">
                <input type="hidden" id="editModId">
                <input type="text" id="editModName" placeholder="Mod Name" required>
                <input type="text" id="editModVersion" placeholder="Game Version" required>
                <input type="text" id="editModAuthor" placeholder="Author Name" required>
                <input type="url" id="editModImage" placeholder="Image URL">
                <input type="url" id="editModDownload" placeholder="Download URL" required>
                <textarea id="editModDescription" placeholder="Description..." rows="3"></textarea>
                <button type="submit">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24">
            <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search bus mods...">
    </div>

    <!-- Mods Grid -->
    <div id="modsContainer" class="mod-grid"></div>

    <!-- Pagination -->
    <div class="pagination">
        <button id="prevPageBtn">Previous</button>
        <span id="pageInfo">Page 1 of 1</span>
        <button id="nextPageBtn">Next</button>
    </div>
</div>

<!-- Mod Details Modal -->
<div id="detailsModal" class="modal">
    <div class="modal-content details-modal">
        <span class="close-btn details-close">&times;</span>
        <div id="detailsContent" class="details-container"></div>
    </div>
</div>

<!-- Download Modal - REMOVED/NO LONGER USED (downloads open in new tab directly) -->

<script>
// ========== CONFIGURATION ==========
const ADMIN_PASSWORD = "nandigawaya25";
let isAdmin = false;
let allMods = [];
let currentPage = 1;
const modsPerPage = 24;
let filteredMods = [];

// ========== STORAGE KEYS ==========
const STORAGE_KEY = "sri_lankan_bus_mods";

// ========== DOM ELEMENTS ==========
const modsContainer = document.getElementById('modsContainer');
const searchInput = document.getElementById('searchInput');
const prevBtn = document.getElementById('prevPageBtn');
const nextBtn = document.getElementById('nextPageBtn');
const pageInfoSpan = document.getElementById('pageInfo');
const adminPanel = document.getElementById('adminPanel');
const loginModal = document.getElementById('loginModal');
const loginSubmitBtn = document.getElementById('loginSubmitBtn');
const adminPassword = document.getElementById('adminPassword');
const logoutBtn = document.getElementById('logoutBtn');
const addModForm = document.getElementById('addModForm');
const mainTitle = document.getElementById('mainTitle');
const editModal = document.getElementById('editModal');
const editModForm = document.getElementById('editModForm');

// ========== HELPER FUNCTIONS ==========
function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

// ========== STORAGE FUNCTIONS ==========
function loadModsFromStorage() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
        allMods = JSON.parse(stored);
    } else {
        allMods = [
            {
                id: "1",
                name: "SLTB Leyland Bus",
                version: "1.59",
                author: "LK Modder",
                imageUrl: "https://via.placeholder.com/300x150?text=SLTB+Bus",
                downloadUrl: "#",
                description: "Classic Sri Lankan transport bus mod for ETS2.",
                timestamp: new Date().toISOString()
            },
            {
                id: "2",
                name: "Ashok Leyland Samara",
                version: "1.59",
                author: "Colombo Mods",
                imageUrl: "https://via.placeholder.com/300x150?text=Ashok+Leyland",
                downloadUrl: "#",
                description: "Popular intercity bus model from Sri Lanka.",
                timestamp: new Date().toISOString()
            }
        ];
        saveModsToStorage();
    }
    applyFilters();
}

function saveModsToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allMods));
}

// ========== ADMIN FUNCTIONS ==========
function checkAdminStatus() {
    const adminStatus = sessionStorage.getItem('bus_mods_admin');
    if (adminStatus === 'true') {
        isAdmin = true;
        adminPanel.style.display = 'block';
    } else {
        isAdmin = false;
        adminPanel.style.display = 'none';
    }
}

function showAdminLoginModal() {
    if (!isAdmin) {
        loginModal.style.display = 'flex';
    } else {
        alert("You are already logged in as admin.");
    }
}

function login(password) {
    if (password === ADMIN_PASSWORD) {
        sessionStorage.setItem('bus_mods_admin', 'true');
        isAdmin = true;
        adminPanel.style.display = 'block';
        loginModal.style.display = 'none';
        adminPassword.value = '';
        renderCurrentPage();
        alert('Login successful! Admin panel activated.');
    } else {
        alert('Wrong password!');
    }
}

function logout() {
    sessionStorage.removeItem('bus_mods_admin');
    isAdmin = false;
    adminPanel.style.display = 'none';
    renderCurrentPage();
    alert('Logged out successfully!');
}

function addMod(mod) {
    if (!mod.name || !mod.version || !mod.author || !mod.downloadUrl) {
        alert('Please fill all required fields (Name, Version, Author, Download URL).');
        return false;
    }
    mod.id = Date.now().toString();
    mod.timestamp = new Date().toISOString();
    allMods.unshift(mod);
    saveModsToStorage();
    applyFilters();
    alert('Mod added successfully!');
    return true;
}

// ========== EDIT MOD FUNCTION ==========
function openEditModal(modId) {
    const mod = allMods.find(m => m.id === modId);
    if (!mod) return;
    
    document.getElementById('editModId').value = mod.id;
    document.getElementById('editModName').value = mod.name || '';
    document.getElementById('editModVersion').value = mod.version || '';
    document.getElementById('editModAuthor').value = mod.author || '';
    document.getElementById('editModImage').value = mod.imageUrl || '';
    document.getElementById('editModDownload').value = mod.downloadUrl || '';
    document.getElementById('editModDescription').value = mod.description || '';
    
    editModal.style.display = 'flex';
}

function updateMod(updatedMod) {
    const index = allMods.findIndex(m => m.id === updatedMod.id);
    if (index !== -1) {
        updatedMod.timestamp = new Date().toISOString();
        allMods[index] = { ...allMods[index], ...updatedMod };
        saveModsToStorage();
        applyFilters();
        alert('Mod updated successfully!');
        return true;
    }
    return false;
}

function deleteMod(modId) {
    if (confirm('Are you sure you want to delete this mod?')) {
        allMods = allMods.filter(mod => mod.id !== modId);
        saveModsToStorage();
        applyFilters();
        alert('Mod deleted!');
    }
}

// ========== DOWNLOAD FUNCTION - Opens in new tab directly ==========
function openDownloadInNewTab(url) {
    if (url && url !== '#' && url.trim() !== '') {
        // Open the download link in a new tab directly
        window.open(url, '_blank', 'noopener,noreferrer');
    } else {
        alert('Download link not available');
    }
}

// ========== FILTER & SEARCH ==========
function applyFilters() {
    const searchTerm = searchInput.value.toLowerCase().trim();
    filteredMods = allMods.filter(mod => {
        const matchesSearch = searchTerm === '' ||
            (mod.name && mod.name.toLowerCase().includes(searchTerm)) ||
            (mod.author && mod.author.toLowerCase().includes(searchTerm)) ||
            (mod.description && mod.description.toLowerCase().includes(searchTerm));
        return matchesSearch;
    });
    currentPage = 1;
    renderCurrentPage();
}

// ========== RENDER FUNCTIONS ==========
function renderCurrentPage() {
    if (!filteredMods.length) {
        modsContainer.innerHTML = '<div class="no-mods">No bus mods found. Add your first mod using admin panel! (Double-click title to login)</div>';
        updatePaginationInfo();
        return;
    }

    const start = (currentPage - 1) * modsPerPage;
    const end = start + modsPerPage;
    const pageMods = filteredMods.slice(start, end);

    modsContainer.innerHTML = '';
    pageMods.forEach(mod => {
        const card = document.createElement('div');
        card.className = 'mod-card';
        card.setAttribute('data-mod-id', mod.id);

        const imgUrl = mod.imageUrl && mod.imageUrl.trim() ? mod.imageUrl : 'https://via.placeholder.com/300x150?text=Bus+Mod';
        const versionLabel = mod.version || 'N/A';
        const authorLabel = mod.author || 'Unknown';
        const desc = mod.description ? (mod.description.length > 100 ? mod.description.substring(0, 100) + '…' : mod.description) : 'No description';

        let adminButtons = '';
        if (isAdmin) {
            adminButtons = `
                <div class="admin-actions">
                    <button class="edit-btn" data-id="${mod.id}">✏️ Edit</button>
                    <button class="delete-btn" data-id="${mod.id}">Delete</button>
                </div>
            `;
        }

        card.innerHTML = `
            <img src="${imgUrl}" alt="${escapeHtml(mod.name)}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x150?text=Image+Error'">
            <h3>${escapeHtml(mod.name)}</h3>
            <div class="mod-badges">
                <span class="badge version-badge">v${escapeHtml(versionLabel)}</span>
            </div>
            <div class="mod-meta">${escapeHtml(authorLabel)}</div>
            <div class="mod-desc">${escapeHtml(desc)}</div>
            <button class="download-btn" data-url="${escapeHtml(mod.downloadUrl)}">Download</button>
            ${adminButtons}
        `;
        modsContainer.appendChild(card);
    });

    // Attach card click for details modal
    document.querySelectorAll('.mod-card').forEach(card => {
        card.addEventListener('click', (e) => {
            if (e.target.classList.contains('download-btn') || 
                e.target.classList.contains('edit-btn') || 
                e.target.classList.contains('delete-btn')) return;
            const modId = card.getAttribute('data-mod-id');
            const mod = allMods.find(m => m.id === modId);
            if (mod) openDetailsModal(mod);
        });
    });

    // Attach download button events - NOW OPENS IN NEW TAB DIRECTLY
    document.querySelectorAll('.download-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const url = btn.getAttribute('data-url');
            openDownloadInNewTab(url);
        });
    });

    // Attach edit button events
    document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.getAttribute('data-id');
            openEditModal(id);
        });
    });

    // Attach delete button events
    document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.getAttribute('data-id');
            deleteMod(id);
        });
    });

    updatePaginationInfo();
}

function updatePaginationInfo() {
    const totalPages = Math.ceil(filteredMods.length / modsPerPage);
    pageInfoSpan.textContent = `Page ${currentPage} of ${totalPages || 1}`;
    prevBtn.disabled = currentPage <= 1;
    nextBtn.disabled = currentPage >= totalPages;
}

function prevPage() {
    if (currentPage > 1) {
        currentPage--;
        renderCurrentPage();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

function nextPage() {
    const totalPages = Math.ceil(filteredMods.length / modsPerPage);
    if (currentPage < totalPages) {
        currentPage++;
        renderCurrentPage();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

// ========== MODAL FUNCTIONS ==========
function openDetailsModal(mod) {
    const modal = document.getElementById('detailsModal');
    const container = document.getElementById('detailsContent');
    const imgUrl = mod.imageUrl && mod.imageUrl.trim() ? mod.imageUrl : 'https://via.placeholder.com/400x200?text=No+Image';

    let editButtonForDetails = '';
    if (isAdmin) {
        editButtonForDetails = `<button class="edit-details-btn" data-id="${mod.id}" style="background:#ffcc00; color:#000; margin-top:0.5rem; padding:8px 16px; border-radius:40px; border:none; font-weight:600; cursor:pointer;">✏️ Edit This Mod</button>`;
    }

    container.innerHTML = `
        <div class="details-image">
            <img src="${imgUrl}" alt="${escapeHtml(mod.name)}" onerror="this.src='https://via.placeholder.com/400x200?text=No+Image'">
        </div>
        <h2>${escapeHtml(mod.name)}</h2>
        <div class="details-meta">
            <span class="badge version-badge">Version: ${escapeHtml(mod.version || 'N/A')}</span>
        </div>
        <p class="details-author"><strong>Author:</strong> ${escapeHtml(mod.author || 'Unknown')}</p>
        <div class="details-description">
            <strong>Description:</strong>
            <p>${escapeHtml(mod.description || 'No description available.')}</p>
        </div>
        <button class="download-details-btn" data-url="${escapeHtml(mod.downloadUrl)}">Download Mod</button>
        ${editButtonForDetails}
    `;

    modal.style.display = 'flex';

    const detailsBtn = container.querySelector('.download-details-btn');
    if (detailsBtn) {
        detailsBtn.addEventListener('click', (e) => {
            const url = detailsBtn.getAttribute('data-url');
            openDownloadInNewTab(url);
        });
    }
    
    const editDetailsBtn = container.querySelector('.edit-details-btn');
    if (editDetailsBtn) {
        editDetailsBtn.addEventListener('click', (e) => {
            const id = editDetailsBtn.getAttribute('data-id');
            modal.style.display = 'none';
            openEditModal(id);
        });
    }
}

function closeModals() {
    const detailsModalEl = document.getElementById('detailsModal');
    const loginModalEl = document.getElementById('loginModal');
    const editModalEl = document.getElementById('editModal');
    if (detailsModalEl) detailsModalEl.style.display = 'none';
    if (loginModalEl) loginModalEl.style.display = 'none';
    if (editModalEl) editModalEl.style.display = 'none';
}

// ========== EVENT LISTENERS ==========
searchInput.addEventListener('input', applyFilters);
prevBtn.addEventListener('click', prevPage);
nextBtn.addEventListener('click', nextPage);

// Double-click title to show admin login
if (mainTitle) {
    mainTitle.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        showAdminLoginModal();
    });
}

loginSubmitBtn.addEventListener('click', () => {
    login(adminPassword.value);
});

adminPassword.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        login(adminPassword.value);
    }
});

logoutBtn.addEventListener('click', logout);

addModForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const newMod = {
        name: document.getElementById('modName').value.trim(),
        version: document.getElementById('modVersion').value.trim(),
        author: document.getElementById('modAuthor').value.trim(),
        imageUrl: document.getElementById('modImage').value.trim(),
        downloadUrl: document.getElementById('modDownload').value.trim(),
        description: document.getElementById('modDescription').value.trim()
    };
    if (addMod(newMod)) {
        addModForm.reset();
    }
});

// Edit form submission
editModForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const updatedMod = {
        id: document.getElementById('editModId').value,
        name: document.getElementById('editModName').value.trim(),
        version: document.getElementById('editModVersion').value.trim(),
        author: document.getElementById('editModAuthor').value.trim(),
        imageUrl: document.getElementById('editModImage').value.trim(),
        downloadUrl: document.getElementById('editModDownload').value.trim(),
        description: document.getElementById('editModDescription').value.trim()
    };
    if (updatedMod.name && updatedMod.version && updatedMod.author && updatedMod.downloadUrl) {
        updateMod(updatedMod);
        editModal.style.display = 'none';
        editModForm.reset();
    } else {
        alert('Please fill all required fields (Name, Version, Author, Download URL).');
    }
});

// Close modals with close buttons
document.querySelectorAll('.close-btn').forEach(btn => {
    btn.addEventListener('click', closeModals);
});
window.addEventListener('click', (e) => {
    if (e.target.classList.contains('modal')) closeModals();
});

// ========== INITIALIZATION ==========
loadModsFromStorage();
checkAdminStatus();

console.log("Admin login hidden: double-click title to login. Download links now open directly in new tab.");
</script>
</body>
</html>
